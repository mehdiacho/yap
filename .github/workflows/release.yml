# Build a signed AAB on every push to main and upload it to the Play Console
# internal testing track. Promote to closed/production by hand in the console.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64   base64 of upload-keystore.jks
#   KEYSTORE_STORE_PASSWORD  keystore password
#   KEYSTORE_KEY_ALIAS       "upload"
#   KEYSTORE_KEY_PASSWORD    key password
#   GOOGLE_SERVICES_JSON     contents of app/google-services.json (it's git-ignored)
#   PLAY_SERVICE_ACCOUNT_JSON  JSON key of a GCP service account invited in
#                              Play Console → Users & permissions with the
#                              "Release to testing tracks" permission
name: Release to Play (internal)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore + Firebase config
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # versionCode must be unique per upload — derive it from the commit count.
      - name: Compute versionCode
        run: echo "YAP_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build AAB
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.greenforrest.yap
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
