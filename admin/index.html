<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yap Admin</title>
<style>
  :root { --indigo:#5B5BD6; --indigo-dark:#4F46C8; --bg:#FCFBFF; --surface:#F2EFF7; --text:#1B1B21; --muted:#47464F; --outline:#C8C5D0; --err:#BA1A1A; --ok:#2E6B4F; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:860px; margin:0 auto; padding:24px 20px 80px; }
  h1 { display:flex; align-items:center; gap:12px; font-size:24px; }
  h1 .dot { width:34px; height:34px; border-radius:10px; background:linear-gradient(150deg,#6D5BEA,#4F46C8); display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:18px; }
  .card { background:var(--surface); border-radius:16px; padding:18px; margin:14px 0; }
  button { background:var(--indigo); color:#fff; border:0; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--indigo); border:1px solid var(--outline); }
  input, select { padding:9px 12px; border:1px solid var(--outline); border-radius:10px; font-size:14px; background:#fff; }
  label { font-size:12px; color:var(--muted); display:block; margin:10px 0 4px; font-weight:600; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > div { flex:1; min-width:140px; }
  .tabs { display:flex; gap:8px; margin-top:18px; }
  .tabs button { background:transparent; color:var(--muted); border:1px solid var(--outline); }
  .tabs button.active { background:var(--indigo); color:#fff; border-color:var(--indigo); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--outline); }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--err); font-size:13px; white-space:pre-wrap; }
  .ok { color:var(--ok); font-size:14px; font-weight:600; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; background:#E4E0FF; color:#3A37A0; }
  code { background:#fff; padding:2px 6px; border-radius:6px; border:1px solid var(--outline); }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot">Y</span> Yap Admin</h1>

  <div id="gate" class="card">
    <p class="muted">Sign in with an admin account to manage users and promo codes.</p>
    <button id="signin">Sign in with Google</button>
    <p id="gateMsg" class="err"></p>
  </div>

  <div id="app" class="hidden">
    <p class="muted">Signed in as <span id="who"></span> · <a href="#" id="signout">sign out</a></p>
    <div class="tabs">
      <button id="tabUsers" class="active">Users</button>
      <button id="tabPromos">Promo codes</button>
    </div>

    <!-- USERS -->
    <div id="paneUsers">
      <div class="card">
        <div class="row">
          <div style="flex:3"><label>Email or UID</label><input id="uq" placeholder="someone@example.com" style="width:100%"></div>
          <div style="flex:0"><button id="usearch">Search</button></div>
        </div>
        <p id="uerr" class="err"></p>
        <div id="uresult" class="hidden">
          <table>
            <tr><th>UID</th><td id="r_uid"></td></tr>
            <tr><th>Email</th><td id="r_email"></td></tr>
            <tr><th>Name</th><td id="r_name"></td></tr>
            <tr><th>Created</th><td id="r_created"></td></tr>
            <tr><th>Plan</th><td><span class="pill" id="r_plan"></span> <span class="muted" id="r_exp"></span></td></tr>
            <tr><th>Usage</th><td id="r_usage"></td></tr>
          </table>
          <div class="row" style="margin-top:14px">
            <div><label>Set plan</label>
              <select id="setPlan"><option value="free">free</option><option value="pro">pro</option></select>
            </div>
            <div><label>Expires in days (blank = never)</label><input id="setDays" type="number" min="1" placeholder="never"></div>
            <div><label>BYOK unlocked</label>
              <select id="setByok"><option value="">leave as is</option><option value="true">true</option><option value="false">false</option></select>
            </div>
            <div style="flex:0"><button id="applyPlan">Apply</button></div>
          </div>
          <p id="applyMsg" class="ok"></p>
        </div>
      </div>
    </div>

    <!-- PROMOS -->
    <div id="panePromos" class="hidden">
      <div class="card">
        <b>Create a code</b>
        <div class="row">
          <div><label>Code (blank = auto)</label><input id="pCode" placeholder="AUTO"></div>
          <div><label>Grant plan</label><select id="pPlan"><option value="pro">pro</option><option value="">none</option></select></div>
          <div><label>Plan days</label><input id="pDays" type="number" value="30" min="1"></div>
          <div><label>BYOK unlock</label><select id="pByok"><option value="">no</option><option value="true">yes</option></select></div>
        </div>
        <div class="row">
          <div><label>Max redemptions</label><input id="pMax" type="number" value="1" min="1"></div>
          <div><label>Lock to UID (optional)</label><input id="pUid" placeholder="any account"></div>
          <div><label>Account younger than (days)</label><input id="pAgeMax" type="number" placeholder="—"></div>
          <div><label>Account older than (days)</label><input id="pAgeMin" type="number" placeholder="—"></div>
        </div>
        <div class="row">
          <div><label>Code expires (optional)</label><input id="pExp" type="date"></div>
          <div style="flex:0"><button id="pCreate">Create code</button></div>
        </div>
        <p id="pMsg" class="ok"></p><p id="pErr" class="err"></p>
      </div>
      <div class="card">
        <div class="row" style="align-items:center"><b style="flex:1">Existing codes</b><button class="ghost" id="pRefresh">Refresh</button></div>
        <div style="overflow-x:auto"><table id="pTable"><thead><tr>
          <th>Code</th><th>Grant</th><th>Criteria</th><th>Used</th><th>Active</th><th>Expires</th>
        </tr></thead><tbody></tbody></table></div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script>
firebase.initializeApp({
  projectId: "yap-mehdiacho",
  appId: "1:179392577570:web:dbe8bb3df15dbaf3fa0a7b",
  storageBucket: "yap-mehdiacho.firebasestorage.app",
  apiKey: "AIzaSyDB4Vp-cg930j73KzwvYyrUnNwgl5JYk0o",
  authDomain: "yap-mehdiacho.firebaseapp.com",
  messagingSenderId: "179392577570",
});
const fns = firebase.app().functions("africa-south1");
const $ = (id) => document.getElementById(id);

$("signin").onclick = () =>
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch((e) => $("gateMsg").textContent = e.message);
$("signout").onclick = (e) => { e.preventDefault(); firebase.auth().signOut(); };

firebase.auth().onAuthStateChanged(async (user) => {
  if (!user) { $("gate").classList.remove("hidden"); $("app").classList.add("hidden"); return; }
  const token = await user.getIdTokenResult();
  if (token.claims.admin !== true) {
    $("gateMsg").textContent = "This account is not an admin.";
    firebase.auth().signOut();
    return;
  }
  $("who").textContent = user.email;
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  loadPromos();
});

// tabs
$("tabUsers").onclick = () => setTab(true);
$("tabPromos").onclick = () => setTab(false);
function setTab(users) {
  $("tabUsers").classList.toggle("active", users);
  $("tabPromos").classList.toggle("active", !users);
  $("paneUsers").classList.toggle("hidden", !users);
  $("panePromos").classList.toggle("hidden", users);
}

// users
let currentUid = null;
$("usearch").onclick = async () => {
  $("uerr").textContent = ""; $("applyMsg").textContent = "";
  try {
    const r = (await fns.httpsCallable("adminSearchUser")({ query: $("uq").value.trim() })).data;
    currentUid = r.uid;
    $("r_uid").textContent = r.uid;
    $("r_email").textContent = r.email ?? "—";
    $("r_name").textContent = r.displayName ?? "—";
    $("r_created").textContent = r.created ?? "—";
    $("r_plan").textContent = r.plan;
    $("r_exp").textContent = r.expiresAt ? ("until " + new Date(r.expiresAt).toLocaleDateString()) : "";
    $("r_usage").textContent = r.usage
      ? `${(r.usage.secondsUsed / 60).toFixed(1)} min used · cycle ${r.usage.cycle}` : "no usage yet";
    $("uresult").classList.remove("hidden");
  } catch (e) { $("uerr").textContent = e.message; $("uresult").classList.add("hidden"); }
};
$("applyPlan").onclick = async () => {
  $("applyMsg").textContent = ""; $("uerr").textContent = "";
  try {
    const payload = { uid: currentUid, plan: $("setPlan").value };
    if ($("setDays").value) payload.days = Number($("setDays").value);
    if ($("setByok").value) payload.byokUnlocked = $("setByok").value === "true";
    await fns.httpsCallable("adminSetEntitlement")(payload);
    $("applyMsg").textContent = "Applied ✓";
    $("usearch").click();
  } catch (e) { $("uerr").textContent = e.message; }
};

// promos
$("pCreate").onclick = async () => {
  $("pMsg").textContent = ""; $("pErr").textContent = "";
  try {
    const grant = {};
    if ($("pPlan").value) { grant.plan = $("pPlan").value; grant.days = Number($("pDays").value || 30); }
    if ($("pByok").value === "true") grant.byokUnlock = true;
    const criteria = {};
    if ($("pUid").value.trim()) criteria.uid = $("pUid").value.trim();
    if ($("pAgeMax").value) criteria.accountAgeMaxDays = Number($("pAgeMax").value);
    if ($("pAgeMin").value) criteria.accountAgeMinDays = Number($("pAgeMin").value);
    const payload = { grant, criteria, maxRedemptions: Number($("pMax").value || 1) };
    if ($("pCode").value.trim()) payload.code = $("pCode").value.trim();
    if ($("pExp").value) payload.expiresAt = new Date($("pExp").value + "T23:59:59").getTime();
    const r = (await fns.httpsCallable("adminCreatePromo")(payload)).data;
    $("pMsg").textContent = "Created: " + r.code;
    loadPromos();
  } catch (e) { $("pErr").textContent = e.message; }
};
$("pRefresh").onclick = loadPromos;
async function loadPromos() {
  try {
    const r = (await fns.httpsCallable("adminListPromos")()).data;
    const tb = $("pTable").querySelector("tbody");
    tb.innerHTML = "";
    for (const p of r.promos) {
      const grant = [p.grant?.plan ? `${p.grant.plan}${p.grant.days ? " " + p.grant.days + "d" : ""}` : null,
                     p.grant?.byokUnlock ? "byok" : null].filter(Boolean).join(", ") || "—";
      const crit = [p.criteria?.uid ? "uid-locked" : null,
                    p.criteria?.accountAgeMaxDays != null ? `<${p.criteria.accountAgeMaxDays}d` : null,
                    p.criteria?.accountAgeMinDays != null ? `>${p.criteria.accountAgeMinDays}d` : null]
                    .filter(Boolean).join(", ") || "any";
      const row = tb.insertRow();
      row.innerHTML = `<td><code>${p.code}</code></td><td>${grant}</td><td>${crit}</td>
        <td>${p.redeemedCount ?? 0}/${p.maxRedemptions ?? 1}</td>
        <td>${p.active ? "yes" : "no"}</td>
        <td>${p.expiresAt ? new Date(p.expiresAt).toLocaleDateString() : "—"}</td>`;
    }
  } catch (e) { $("pErr").textContent = e.message; }
}
</script>
</body>
</html>
